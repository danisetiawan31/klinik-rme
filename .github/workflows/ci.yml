name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend (Go + Database Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Go Vet
        run: go vet ./...

      - name: Check Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "File berikut belum diformat dengan gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # Docker sudah tersedia secara default di GitHub-hosted ubuntu-latest runner,
      # sehingga test concurrency & integration berbasis testcontainers-go
      # dapat berjalan otomatis.
      - name: Run Backend Tests
        run: go test -v -p 1 ./...

  frontend-ci:
    name: Frontend (Angular + Vitest + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Tests (Vitest)
        run: npx ng test --watch=false

      - name: Build Production Bundle
        run: npm run build
