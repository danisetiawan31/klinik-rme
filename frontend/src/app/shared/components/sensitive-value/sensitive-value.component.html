@if (mode() === 'input') {
  <div class="relative w-full">
    <input
      hlmInput
      [id]="id() || 'sensitive-input'"
      [name]="name() || id() || 'sensitive-input'"
      [type]="isRevealed() ? 'text' : 'password'"
      [placeholder]="placeholder() || 'Kata sandi'"
      placeholder="Kata sandi"
      [title]="placeholder() || 'Kata sandi'"
      title="Kata sandi"
      [disabled]="isDisabled()"
      [value]="value()"
      (input)="onInput($event)"
      (blur)="onBlur()"
      class="pr-10"
      autocomplete="current-password"
      [attr.aria-label]="placeholder() || 'Kata sandi'"
    />
    <button
      type="button"
      class="absolute right-0 top-0 h-9 w-9 flex items-center justify-center text-muted-foreground hover:text-foreground transition-colors cursor-pointer disabled:pointer-events-none disabled:opacity-50"
      (click)="toggleReveal()"
      [disabled]="isDisabled()"
      [attr.aria-label]="isRevealed() ? 'Sembunyikan password' : 'Tampilkan password'"
      [attr.aria-pressed]="isRevealed()"
    >
      @if (isRevealed()) {
        <ng-icon hlm size="sm" name="lucideEyeOff" aria-hidden="true" />
      } @else {
        <ng-icon hlm size="sm" name="lucideEye" aria-hidden="true" />
      }
    </button>
  </div>
} @else {
  <!-- Display mode: NIK masking -->
  <span class="font-mono text-sm inline-flex items-center gap-1.5">
    {{ formattedDisplayValue() }}
    <button
      type="button"
      class="h-6 w-6 inline-flex items-center justify-center text-muted-foreground hover:text-foreground transition-colors cursor-pointer rounded-md"
      (click)="toggleReveal()"
      [attr.aria-label]="isRevealed() ? 'Sembunyikan NIK' : 'Tampilkan NIK'"
      [attr.aria-pressed]="isRevealed()"
    >
      @if (isRevealed()) {
        <ng-icon hlm size="xs" name="lucideEyeOff" aria-hidden="true" />
      } @else {
        <ng-icon hlm size="xs" name="lucideEye" aria-hidden="true" />
      }
    </button>
  </span>
}
