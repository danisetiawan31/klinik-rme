<div class="fixed inset-0 z-50 bg-background/80 backdrop-blur-xs flex items-center justify-center p-4">
  <hlm-card class="w-full max-w-lg p-6 space-y-5 bg-card border-border shadow-2xl rounded-2xl animate-in fade-in zoom-in-95 duration-150">
    <div class="space-y-1">
      <h3 class="text-lg font-heading font-bold text-foreground flex items-center gap-2">
        <ng-icon hlm size="xs" name="lucideKey" class="text-primary" aria-hidden="true" />
        {{ title() }}
      </h3>
      <p class="text-xs text-muted-foreground leading-relaxed">
        {{ description() }}
      </p>
    </div>

    <!-- Warning Banner -->
    <hlm-alert variant="warning" class="border-l-4 border-l-warning p-3 text-xs">
      <ng-icon hlm size="xs" name="lucideAlertTriangle" aria-hidden="true" />
      <div hlmAlertTitle class="font-bold">Penting: Hanya Ditampilkan Sekali</div>
      <div hlmAlertDescription class="text-[11px] mt-0.5">
        Demi keamanan, database hanya menyimpan hash. Kunci atau tautan mentah tidak dapat dilihat kembali setelah dialog ini ditutup.
      </div>
    </hlm-alert>

    <!-- Value Display & Copy Control -->
    <div class="space-y-2">
      <label hlmLabel class="text-xs font-semibold text-foreground">
        {{ label() }}
      </label>
      <div class="flex items-center gap-2">
        <input
          hlmInput
          type="text"
          readonly
          [value]="secretValue()"
          class="flex-1 font-mono text-xs bg-muted/30 select-all"
        />
        <button
          hlmBtn
          variant="secondary"
          size="default"
          type="button"
          (click)="copyToClipboard()"
          class="shrink-0 flex items-center gap-1.5 text-xs"
        >
          @if (isCopied()) {
            <ng-icon hlm size="xs" name="lucideCheck" class="text-primary" aria-hidden="true" />
            <span class="text-primary font-bold">Tersalin!</span>
          } @else {
            <ng-icon hlm size="xs" name="lucideCopy" aria-hidden="true" />
            <span>Salin</span>
          }
        </button>
      </div>
    </div>

    <div class="flex justify-end pt-2 border-t border-border">
      <button
        hlmBtn
        variant="default"
        size="sm"
        type="button"
        (click)="onClose()"
        class="px-5 text-xs"
      >
        Tutup & Selesai
      </button>
    </div>
  </hlm-card>
</div>
