<span
  hlmBadge
  variant="outline"
  [class]="'bg-purple-500/10 border border-purple-500/30 text-purple-700 dark:text-purple-300 ' + sizeClass()"
  [title]="reason() ? 'Pasien Prioritas: ' + reason() : 'Pasien Prioritas'"
  [attr.aria-label]="'Pasien Prioritas' + (reason() ? ': ' + reason() : '')"
>
  @if (size() === 'xs') {
    <ng-icon
      hlm
      size="xs"
      [name]="iconName()"
      class="text-purple-600 dark:text-purple-400"
      aria-hidden="true"
    />
  } @else {
    <ng-icon
      hlm
      [size]="size() === 'sm' ? 'xs' : 'xs'"
      [name]="iconName()"
      class="text-purple-600 dark:text-purple-400 shrink-0"
      aria-hidden="true"
    />
    <span>{{ displayLabel() }}</span>
  }
</span>
