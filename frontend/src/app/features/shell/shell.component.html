<hlm-sidebar-wrapper>
  <!-- 1. Spartan Inset Sidebar Component -->
  <hlm-sidebar variant="inset" collapsible="icon">
    <!-- Sidebar Header: Clinic Brand with Health Icon -->
    <hlm-sidebar-header>
      <a routerLink="/" class="flex items-center gap-2.5 p-1 rounded-lg hover:bg-muted/60 transition-colors select-none group-data-[collapsible=icon]:p-0 group-data-[collapsible=icon]:justify-center">
        <!-- Medical Health Cross Icon -->
        <div class="h-8 w-8 rounded-lg bg-primary text-primary-foreground flex items-center justify-center shadow-xs shrink-0">
          <ng-icon hlm size="sm" name="lucideHeartPulse" aria-hidden="true" />
        </div>
        <div class="grid flex-1 text-left text-sm leading-tight min-w-0 group-data-[collapsible=icon]:hidden">
          <span class="truncate font-semibold text-foreground text-xs">{{ klinikName() }}</span>
          <span class="truncate text-[10px] text-muted-foreground">Sistem RME & Antrian</span>
        </div>
      </a>
    </hlm-sidebar-header>

    <!-- Sidebar Content: Grouped Navigation -->
    <hlm-sidebar-content>
      @for (group of navGroups(); track group.title) {
        <hlm-sidebar-group>
          <div hlmSidebarGroupLabel>{{ group.title }}</div>
          <div hlmSidebarGroupContent>
            <ul hlmSidebarMenu>
              @for (item of group.items; track item.route) {
                <li hlmSidebarMenuItem>
                  <a
                    hlmSidebarMenuButton
                    [routerLink]="item.route"
                    routerLinkActive
                    #rla="routerLinkActive"
                    [isActive]="rla.isActive"
                    [routerLinkActiveOptions]="{ exact: item.route === '/' }"
                    [title]="item.label"
                  >
                    <ng-icon hlm size="base" [name]="item.iconName" class="shrink-0" aria-hidden="true" />
                    <span class="truncate group-data-[collapsible=icon]:hidden">{{ item.label }}</span>
                  </a>
                </li>
              }
            </ul>
          </div>
        </hlm-sidebar-group>
      }
    </hlm-sidebar-content>

    <!-- Sidebar Footer: Compact User Profile Card with Dropdown -->
    <hlm-sidebar-footer>
      <ul hlmSidebarMenu>
        <li hlmSidebarMenuItem>
          <button
            hlmSidebarMenuButton
            size="lg"
            [hlmDropdownMenuTrigger]="userMenu"
            class="data-[state=open]:bg-muted hover:bg-muted p-1.5 rounded-lg transition-colors border border-border/40 cursor-pointer group-data-[collapsible=icon]:p-0 group-data-[collapsible=icon]:size-8! group-data-[collapsible=icon]:justify-center group-data-[collapsible=icon]:border-0"
            aria-label="Menu Pengguna"
          >
            <hlm-avatar size="sm" class="bg-primary text-primary-foreground font-semibold text-xs shrink-0 ring-1 ring-border">
              <span hlmAvatarFallback>{{ userInitial() }}</span>
            </hlm-avatar>
            <div class="grid flex-1 text-left text-xs leading-tight min-w-0 ml-1 group-data-[collapsible=icon]:hidden">
              <span class="truncate font-semibold text-foreground">{{ userName() }}</span>
              <span class="truncate text-[10px] text-muted-foreground capitalize">{{ primaryRole() }}</span>
            </div>
            <ng-icon hlm size="xs" name="lucideChevronsUpDown" class="ml-auto text-muted-foreground shrink-0 group-data-[collapsible=icon]:hidden" aria-hidden="true" />
          </button>

          <!-- Dropdown Menu Content -->
          <ng-template #userMenu>
            <div hlmDropdownMenu class="w-60 p-1.5 bg-card border border-border rounded-xl shadow-3">
              <div class="px-3 py-2 border-b border-border/80 mb-1">
                <p class="text-[10px] text-muted-foreground font-medium">Akun Masuk</p>
                <p class="text-xs font-bold text-foreground truncate mt-0.5">{{ userName() }}</p>
                <p class="text-[10px] text-primary font-semibold capitalize mt-0.5">{{ primaryRole() }}</p>
              </div>
              <div class="py-0.5 space-y-0.5">
                <a
                  routerLink="/profil"
                  hlmDropdownMenuItem
                  class="w-full flex items-center gap-2 px-3 py-2 text-xs text-foreground hover:bg-muted rounded-lg cursor-pointer transition-colors"
                >
                  <ng-icon hlm size="xs" name="lucideSettings" class="text-muted-foreground" aria-hidden="true" />
                  <span>Pengaturan Akun</span>
                </a>
                <button
                  hlmDropdownMenuItem
                  (click)="logout()"
                  class="w-full flex items-center gap-2 px-3 py-2 text-xs text-destructive hover:bg-destructive/10 rounded-lg cursor-pointer transition-colors"
                >
                  <ng-icon hlm size="xs" name="lucideLogOut" class="text-destructive" aria-hidden="true" />
                  <span>Keluar (Logout)</span>
                </button>
              </div>
            </div>
          </ng-template>
        </li>
      </ul>
    </hlm-sidebar-footer>

    <button
      hlmSidebarRail
      aria-label="Toggle Sidebar Rail"
      title="Toggle Sidebar Rail"
    ></button>
  </hlm-sidebar>

  <!-- 2. Spartan Inset Main Container -->
  <main hlmSidebarInset class="flex flex-col min-h-screen bg-background">
    <!-- Top Inset Header Bar -->
    <header class="flex h-14 shrink-0 items-center justify-between gap-3 border-b border-border/80 bg-card px-4 sticky top-0 z-10 transition-[width,height] ease-linear">
      <div class="flex items-center gap-3">
        <button
          hlmSidebarTrigger
          variant="ghost"
          size="icon"
          class="h-8 w-8 text-foreground hover:bg-muted rounded-md cursor-pointer"
          aria-label="Toggle Sidebar"
          title="Toggle Sidebar"
        ></button>
        <div class="h-4 w-px bg-border"></div>
        <div class="flex items-center gap-2">
          <!-- Medical Icon in Topbar -->
          <div class="h-6 w-6 rounded bg-primary text-primary-foreground flex items-center justify-center shadow-2xs shrink-0">
            <ng-icon hlm size="xs" name="lucideHeartPulse" aria-hidden="true" />
          </div>
          <span class="text-xs font-semibold text-foreground hidden sm:inline-block">
            {{ klinikName() }}
          </span>
        </div>
      </div>

      <!-- Right Header Actions -->
      <div class="flex items-center gap-3">
        <app-clinic-status-indicator />
      </div>
    </header>

    <!-- Main Dynamic Router Outlet View Container -->
    <div class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
      <router-outlet />
    </div>
  </main>
</hlm-sidebar-wrapper>
