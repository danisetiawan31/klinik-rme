<div
  class="flex items-center gap-3.5 p-3.5 sm:p-4 rounded-xl bg-card/90 border border-border/80 shadow-2xs backdrop-blur-md transition-all duration-200"
  [class]="cardHoverBorderClass()"
>
  <div
    class="size-10 rounded-xl flex items-center justify-center shrink-0 shadow-2xs border"
    [class]="iconBoxClass()"
  >
    <ng-icon hlm size="base" [name]="iconName()" aria-hidden="true" />
  </div>
  <div class="min-w-0 flex-1">
    <div class="text-[11px] sm:text-xs truncate" [class]="labelColorClass()">
      {{ label() }}
    </div>
    <div class="text-lg sm:text-2xl font-heading font-bold text-foreground tabular-nums leading-tight mt-0.5">
      {{ value() }}
      @if (unit()) {
        <span class="text-[11px] font-normal text-muted-foreground font-sans ml-1">{{ unit() }}</span>
      }
    </div>
  </div>
</div>
