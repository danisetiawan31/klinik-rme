<div class="max-w-7xl mx-auto pb-4">
  @if (isDokter()) {
    <app-doctor-dashboard
      [userName]="userName()"
      [isKlinikBuka]="isKlinikBuka()"
      [jamOperasionalStr]="jamOperasionalStr()"
      [currentDateStr]="currentDateStr()"
      [currentTimeStr]="currentTimeStr()"
      [selesaiDilayani]="selesaiDilayani()"
      [antrianMenunggu]="antrianMenunggu()"
      [pasienPrioritas]="pasienPrioritas()"
      [totalPasien]="totalPasien()"
      [activeCalledPatient]="activeCalledPatient()"
      [antrianMenungguList]="antrianMenungguList()"
      [antrianSelesaiList]="antrianSelesaiList()"
      [doctorSearchQuery]="doctorSearchQuery()"
      [doctorSearchResults]="doctorSearchResults()"
      [isSearchingDoctor]="isSearchingDoctor()"
      (searchInput)="onDoctorSearchInput($event)"
    />
  } @else if (isPetugas()) {
    <app-petugas-dashboard
      [userName]="userName()"
      [isKlinikBuka]="isKlinikBuka()"
      [jamOperasionalStr]="jamOperasionalStr()"
      [currentDateStr]="currentDateStr()"
      [currentTimeStr]="currentTimeStr()"
      [totalPasien]="totalPasien()"
      [antrianMenunggu]="antrianMenunggu()"
      [selesaiDilayani]="selesaiDilayani()"
      [pasienPrioritas]="pasienPrioritas()"
      [antrianList]="antrianList()"
    />
  } @else if (isAdmin()) {
    <app-admin-dashboard-view
      [userName]="userName()"
      [isKlinikBuka]="isKlinikBuka()"
      [jamOperasionalStr]="jamOperasionalStr()"
      [currentDateStr]="currentDateStr()"
      [currentTimeStr]="currentTimeStr()"
      [totalPasien]="totalPasien()"
      [attendanceRate]="attendanceRate()"
      [performanceRate]="performanceRate()"
      [totalTidakHadirLaporan]="totalTidakHadirLaporan()"
      [antrianList]="antrianList()"
      [chartSeries]="chartSeries()"
      [chartOptions]="chartOptions()"
      [trendVsKemarin]="trendVsKemarin()"
    />
  }
</div>
