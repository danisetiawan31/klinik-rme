<div class="max-w-5xl mx-auto space-y-6 pb-12">
  <!-- Top Navigation & Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div class="space-y-1">
      <a
        routerLink="/antrian"
        class="inline-flex items-center gap-1.5 text-xs font-medium text-muted-foreground hover:text-foreground transition-colors mb-1"
      >
        <ng-icon hlm size="xs" name="lucideArrowLeft" aria-hidden="true" />
        Kembali ke Antrian
      </a>
      <h1 class="text-2xl sm:text-3xl font-heading font-bold text-foreground tracking-tight flex items-center gap-2.5">
        <ng-icon hlm size="base" name="lucideStethoscope" class="text-primary" aria-hidden="true" />
        Pemeriksaan Pasien (SOAP)
      </h1>
      <p class="text-sm text-muted-foreground">
        Catat hasil anamnesis klinis, pemeriksaan fisik objektif, diagnosis ICD-10, dan terapi resep.
      </p>
    </div>
  </div>

  @if (isLoading()) {
    <!-- Skeleton Loading State -->
    <div class="space-y-6">
      <hlm-card class="p-6 space-y-4">
        <div class="flex items-center gap-4">
          <hlm-skeleton class="size-14 rounded-2xl" />
          <div class="space-y-2 flex-1">
            <hlm-skeleton class="h-6 w-48 rounded" />
            <hlm-skeleton class="h-4 w-72 rounded" />
          </div>
        </div>
      </hlm-card>
      <hlm-card class="p-6 space-y-6">
        <hlm-skeleton class="h-28 w-full rounded-xl" />
        <hlm-skeleton class="h-28 w-full rounded-xl" />
        <hlm-skeleton class="h-20 w-full rounded-xl" />
      </hlm-card>
    </div>
  } @else if (errorMessage()) {
    <!-- Error State -->
    <hlm-alert variant="destructive" class="p-6">
      <ng-icon hlm size="base" name="lucideAlertCircle" aria-hidden="true" />
      <div hlmAlertTitle class="font-bold">Gagal Membuka Formulir Pemeriksaan</div>
      <div hlmAlertDescription class="mt-1 text-sm">
        {{ errorMessage() }}
      </div>
      <div class="mt-4">
        <a hlmBtn variant="outline" size="sm" routerLink="/antrian">
          Kembali ke Antrian
        </a>
      </div>
    </hlm-alert>
  } @else {
    <!-- Patient Context Strip Card & History -->
    <app-soap-patient-header
      [pasien]="pasien()"
      [kunjungan]="kunjungan()"
      [riwayatList]="riwayatList()"
    />

    <!-- Main Clinical Examination Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Section 1: Anamnesis (Subjektif) -->
      <app-soap-subjective-section [form]="form" />

      <!-- Section 2: Pemeriksaan Fisik (Objektif) -->
      <app-soap-objective-section [form]="form" />

      <!-- Section 3: Diagnosis (Asesmen) -->
      <app-soap-assessment-section
        [diagnosisArray]="diagnosisArray"
        (addDiagnosis)="addDiagnosis()"
        (removeDiagnosis)="removeDiagnosis($event)"
      />

      <!-- Section 4: Tindakan & Terapi / Resep (Plan) -->
      <app-soap-plan-section
        [tindakanArray]="tindakanArray"
        (addTindakan)="addTindakan($event)"
        (removeTindakan)="removeTindakan($event)"
      />

      <!-- Form Submission Footer -->
      <div class="flex flex-col-reverse sm:flex-row items-center justify-end gap-3 pt-4 border-t border-border">
        <a
          hlmBtn
          variant="outline"
          type="button"
          routerLink="/antrian"
          [disabled]="isSubmitting()"
        >
          Batal
        </a>
        <button
          hlmBtn
          variant="default"
          type="submit"
          [disabled]="isSubmitting() || form.invalid"
          class="w-full sm:w-auto flex items-center justify-center gap-2 min-w-44"
        >
          @if (isSubmitting()) {
            <span class="animate-spin size-4 border-2 border-primary-foreground border-t-transparent rounded-full" aria-hidden="true"></span>
            <span>Menyimpan...</span>
          } @else {
            <ng-icon hlm size="xs" name="lucideCheckCircle2" aria-hidden="true" />
            <span>Simpan Rekam Medis</span>
          }
        </button>
      </div>
    </form>
  }
</div>
