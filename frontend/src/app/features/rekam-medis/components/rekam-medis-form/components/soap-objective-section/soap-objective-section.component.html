<hlm-card class="p-5 sm:p-6 space-y-4 border-border shadow-2xs" [formGroup]="form()">
  <div class="flex items-center justify-between border-b border-border/80 pb-3.5">
    <div class="space-y-0.5">
      <h3 class="text-base font-heading font-bold text-foreground flex items-center gap-2.5">
        <span class="size-7 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-700 flex items-center justify-center text-xs font-black font-mono shadow-2xs">O</span>
        <span>Pemeriksaan Fisik & Tanda Vital</span>
        <span class="text-destructive">*</span>
      </h3>
      <p class="text-xs text-muted-foreground">
        Tanda-tanda vital (TD, Nadi, Suhu, RR), pemeriksaan fisik umum, atau hasil lab penunjang.
      </p>
    </div>
  </div>

  <div class="space-y-2">
    <label hlmLabel for="hasilPemeriksaan" class="text-xs font-semibold text-foreground flex items-center justify-between">
      <span>Hasil Pemeriksaan Fisik & Status Klinis <span class="text-destructive">*</span></span>
      <span class="text-[11px] font-normal text-muted-foreground">Min. 3 karakter</span>
    </label>
    <textarea
      hlmTextarea
      id="hasilPemeriksaan"
      formControlName="hasilPemeriksaan"
      rows="3"
      class="w-full text-xs sm:text-sm resize-y leading-relaxed"
      placeholder="Contoh: TD: 120/80 mmHg, Nadi: 82x/m, Suhu: 38.2°C, RR: 18x/m. Faring hiperemis (+), pembesaran tonsil T1-T1..."
    ></textarea>
    @if (form().get('hasilPemeriksaan')?.touched && form().get('hasilPemeriksaan')?.invalid) {
      <p class="text-xs text-destructive flex items-center gap-1 font-medium">
        <ng-icon hlm size="xs" name="lucideAlertCircle" aria-hidden="true" />
        Hasil pemeriksaan fisik wajib diisi minimal 3 karakter
      </p>
    }
  </div>
</hlm-card>
