<hlm-card class="p-5 sm:p-6 space-y-4 border-border shadow-2xs" [formGroup]="form()">
  <div class="flex items-center justify-between border-b border-border/80 pb-3.5">
    <div class="space-y-0.5">
      <h3 class="text-base font-heading font-bold text-foreground flex items-center gap-2.5">
        <span class="size-7 rounded-xl bg-sky-500/15 border border-sky-500/30 text-sky-700 flex items-center justify-center text-xs font-black font-mono shadow-2xs">S</span>
        <span>Anamnesis / Keluhan Pasien</span>
        <span class="text-destructive">*</span>
      </h3>
      <p class="text-xs text-muted-foreground">
        Uraian keluhan utama pasien, durasi gejala, riwayat penyakit saat ini, dan alergi obat/makanan.
      </p>
    </div>
  </div>

  <div class="space-y-2">
    <label hlmLabel for="keluhan" class="text-xs font-semibold text-foreground flex items-center justify-between">
      <span>Keluhan Utama & Riwayat Gejala <span class="text-destructive">*</span></span>
      <span class="text-[11px] font-normal text-muted-foreground">Min. 3 karakter</span>
    </label>
    <textarea
      hlmTextarea
      id="keluhan"
      formControlName="keluhan"
      rows="3"
      class="w-full text-xs sm:text-sm resize-y leading-relaxed"
      placeholder="Contoh: Pasien mengeluh demam sejak 3 hari lalu disertai batuk berdahak dan nyeri tenggorokan..."
    ></textarea>
    @if (form().get('keluhan')?.touched && form().get('keluhan')?.invalid) {
      <p class="text-xs text-destructive flex items-center gap-1 font-medium">
        <ng-icon hlm size="xs" name="lucideAlertCircle" aria-hidden="true" />
        Keluhan pasien wajib diisi minimal 3 karakter
      </p>
    }
  </div>
</hlm-card>
