<hlm-card class="p-5 sm:p-6 space-y-4" [formGroup]="form()">
  <div class="flex items-center justify-between border-b border-border/60 pb-3">
    <div class="space-y-0.5">
      <h3 class="text-base font-heading font-bold text-foreground flex items-center gap-2">
        <span class="size-6 rounded-lg bg-primary/10 text-primary flex items-center justify-center text-xs font-bold font-mono">S</span>
        Anamnesis / Keluhan Pasien <span class="text-destructive">*</span>
      </h3>
      <p class="text-xs text-muted-foreground">
        Uraian keluhan utama pasien, durasi gejala, riwayat penyakit saat ini, dan alergi.
      </p>
    </div>
  </div>

  <div class="space-y-2">
    <label hlmLabel for="keluhan" class="text-xs font-semibold text-foreground">
      Keluhan & Gejala <span class="text-destructive">*</span>
    </label>
    <textarea
      hlmTextarea
      id="keluhan"
      formControlName="keluhan"
      rows="3"
      class="w-full text-sm resize-y"
      placeholder="Contoh: Pasien mengeluh demam sejak 3 hari lalu disertai batuk berdahak dan nyeri tenggorokan..."
    ></textarea>
    @if (form().get('keluhan')?.touched && form().get('keluhan')?.invalid) {
      <p class="text-xs text-destructive flex items-center gap-1">
        <ng-icon hlm size="xs" name="lucideAlertCircle" aria-hidden="true" />
        Keluhan pasien wajib diisi minimal 3 karakter
      </p>
    }
  </div>
</hlm-card>
